name: Auto Label Issue

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Parse Issue Body & Title to Assign Milestone, Labels, Assignees, and Dependencies
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const title = issue.title || '';
            const body = issue.body || '';

            // ----------------------------------------------------
            // 1. Assign Milestone (M0, M1, M2, M3 in Title)
            // ----------------------------------------------------
            const milestoneMatch = title.match(/\b(m[0-3])\b/i);
            if (milestoneMatch) {
              const targetMilestoneTitle = milestoneMatch[1].toUpperCase();

              const milestones = await github.paginate(github.rest.issues.listMilestones, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all'
              });

              const matchedMilestone = milestones.find(
                m => m.title.trim().toUpperCase() === targetMilestoneTitle
              );

              if (matchedMilestone) {
                if (!issue.milestone || issue.milestone.number !== matchedMilestone.number) {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    milestone: matchedMilestone.number
                  });
                  core.info(`Assigned milestone ${matchedMilestone.title} to issue #${issueNumber}`);
                }
              } else {
                core.warning(`Milestone "${targetMilestoneTitle}" does not exist in repository.`);
              }
            }

            // ----------------------------------------------------
            // 2. Parse Checked Assignees from Issue Body
            // ----------------------------------------------------
            const validUsers = ['bradyb2005', 'advvaith', 'mooz-55', 'Lxamwastaken'];
            const assigneesToAdd = [];

            for (const user of validUsers) {
              const userRegex = new RegExp(`-\\s*\\[[xX]\\]\\s*@?${user}\\b`, 'i');
              if (userRegex.test(body)) {
                assigneesToAdd.push(user);
              }
            }

            if (assigneesToAdd.length > 0) {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                assignees: assigneesToAdd
              });
              core.info(`Assigned ${assigneesToAdd.join(', ')} to issue #${issueNumber}`);
            }

            // ----------------------------------------------------
            // 3. Parse Checked Labels from Issue Body
            // ----------------------------------------------------
            const labelCandidates = [
              'new feature',
              'bug fix',
              'refactor',
              'documentation',
              'setup/tooling',
              'frontend',
              'backend'
            ];

            const labelsToAdd = [];
            for (const label of labelCandidates) {
              const escaped = label.replace('/', '\\/');
              const labelRegex = new RegExp(`-\\s*\\[[xX]\\]\\s*${escaped}\\b`, 'i');
              if (labelRegex.test(body)) {
                labelsToAdd.push(label);
              }
            }

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: labelsToAdd
              });
              core.info(`Added labels: ${labelsToAdd.join(', ')} to issue #${issueNumber}`);
            }

            // ----------------------------------------------------
            // 4. Parse "Blocked by #..." and Link Native Relationships
            // ----------------------------------------------------
            // Matches "Blocked by #4", "Blocked by #4, #5", "Blocked by: #4 #5", etc.
            const blockedLineMatch = body.match(/Blocked\s+by[:\s]*([#\d,\s]+)/i);

            if (blockedLineMatch) {
              const rawList = blockedLineMatch[1];
              // Extract all digits following '#'
              const matches = [...rawList.matchAll(/#(\d+)/g)];
              const blockingNumbers = matches
                .map(m => parseInt(m[1], 10))
                .filter(num => num !== issueNumber); // Ignore self-references

              if (blockingNumbers.length > 0) {
                try {
                  // Fetch the GraphQL node ID of the current issue
                  const currentIssueQuery = `
                    query($owner: String!, $repo: String!, $number: Int!) {
                      repository(owner: $owner, name: $repo) {
                        issue(number: $number) {
                          id
                        }
                      }
                    }
                  `;
                  const currentRes = await github.graphql(currentIssueQuery, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    number: issueNumber
                  });
                  const currentIssueId = currentRes?.repository?.issue?.id;

                  for (const bNum of blockingNumbers) {
                    try {
                      // Fetch the GraphQL node ID for each blocker issue
                      const blockerRes = await github.graphql(currentIssueQuery, {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        number: bNum
                      });
                      const blockerIssueId = blockerRes?.repository?.issue?.id;

                      if (currentIssueId && blockerIssueId) {
                        // Link relationship via GraphQL mutation
                        await github.graphql(`
                          mutation($issueId: ID!, $blockedById: ID!) {
                            addBlockedBy(input: { issueId: $issueId, blockedById: $blockedById }) {
                              clientMutationId
                            }
                          }
                        `, {
                          issueId: currentIssueId,
                          blockedById: blockerIssueId
                        });
                        core.info(`Linked native blocker: #${bNum} blocks #${issueNumber}`);
                      }
                    } catch (err) {
                      // Silently skip if the link already exists or an issue number is invalid
                      core.warning(`Could not link blocker #${bNum}: ${err.message}`);
                    }
                  }
                } catch (err) {
                  core.warning(`Failed to query GraphQL node IDs: ${err.message}`);
                }
              }
            }
