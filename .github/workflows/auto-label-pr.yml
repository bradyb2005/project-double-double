name: Auto Label PR, Assignee, Reviewers and Milestone

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to label manually'
        required: true
        type: number
  pull_request:
    types: [opened, edited]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Apply labels, assignee, reviewers, and milestone
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber;
            let body = '';
            let title = '';
            let author = '';

            // Handle manual run vs PR event
            if (context.eventName === 'workflow_dispatch') {
              prNumber = context.payload.inputs.pr_number;
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              body = pr.body || '';
              title = pr.title || '';
              author = pr.user ? pr.user.login : '';
            } else if (context.payload.pull_request) {
              prNumber = context.payload.pull_request.number;
              body = context.payload.pull_request.body || '';
              title = context.payload.pull_request.title || '';
              author = context.payload.pull_request.user ? context.payload.pull_request.user.login : '';
            } else {
              core.info('No pull request found in event context.');
              return;
            }

            // Allowed core team members
            const teamMembers = ['bradyb2005', 'Lxamwastaken', 'mooz-55', 'advvaith'];
            const isTeamMember = teamMembers.some(
              member => member.toLowerCase() === author.toLowerCase()
            );

            // 1. Assign Author & Request Reviewers (Only for team members on open/manual dispatch)
            if (context.eventName === 'workflow_dispatch' || context.payload.action === 'opened') {
              if (isTeamMember) {
                // Auto-assign author
                try {
                  await github.rest.issues.addAssignees({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    assignees: [author]
                  });
                  core.info(`Assigned PR to author: ${author}`);
                } catch (err) {
                  core.warning(`Failed to assign author ${author}: ${err.message}`);
                }

                // Request review from the remaining 3 team members
                const reviewers = teamMembers.filter(
                  member => member.toLowerCase() !== author.toLowerCase()
                );

                if (reviewers.length > 0) {
                  try {
                    await github.rest.pulls.requestReviewers({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      pull_number: prNumber,
                      reviewers: reviewers
                    });
                    core.info(`Requested reviews from: ${reviewers.join(', ')}`);
                  } catch (err) {
                    core.warning(`Failed to request reviewers: ${err.message}`);
                  }
                }
              } else {
                core.info(`Author "${author}" is outside the team list; skipping auto-assignment and review requests.`);
              }
            }

            // 2. Process Checkbox Labels
            const labelMap = [
              { regex: /- \[[xX]\]\s*New feature/i, label: 'new feature' },
              { regex: /- \[[xX]\]\s*Testing/i, label: 'testing' },
              { regex: /- \[[xX]\]\s*Bug fix/i, label: 'bug fix' },
              { regex: /- \[[xX]\]\s*Refactor\s*\(no behavior change\)/i, label: 'refactor' },
              { regex: /- \[[xX]\]\s*Documentation\s*\/\s*scrum notes/i, label: 'documentation' },
              { regex: /- \[[xX]\]\s*Setup\s*\/\s*tooling\s*\/\s*CI/i, label: 'setup/tooling' }
            ];

            const labelsToAdd = [];
            for (const item of labelMap) {
              if (item.regex.test(body)) {
                labelsToAdd.push(item.label);
              }
            }

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: labelsToAdd
              });
              core.info(`Successfully added labels: ${labelsToAdd.join(', ')}`);
            } else {
              core.info('No matching checked boxes found.');
            }

            // 3. Process Milestone from Title tag (e.g. [M1], [M0], [M2])
            const milestoneMatch = title.match(/\[M(\d+)\]/i);
            if (milestoneMatch) {
              const milestoneNum = milestoneMatch[1];
              core.info(`Detected milestone prefix M${milestoneNum} in title.`);

              // Fetch existing open milestones in the repo
              const { data: milestones } = await github.rest.issues.listMilestones({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open'
              });

              // Look for a milestone title starting with "Milestone X" or "M X"
              const targetMilestone = milestones.find(m => {
                const titleLower = m.title.toLowerCase();
                return (
                  titleLower.includes(`milestone ${milestoneNum}`) ||
                  titleLower.startsWith(`m${milestoneNum}`)
                );
              });

              if (targetMilestone) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  milestone: targetMilestone.number
                });
                core.info(`Assigned PR to milestone: "${targetMilestone.title}" (ID: ${targetMilestone.number})`);
              } else {
                core.warning(`Could not find an open milestone matching "Milestone ${milestoneNum}".`);
              }
            }
